name: Reference APK inspection

on:
  pull_request:
    paths:
      - "tools/inspect_reference_apk.py"
      - "tests/test_inspect_reference_apk.py"
      - ".github/workflows/reference-apk-inspection.yml"
  push:
    branches:
      - main
      - "stabilization/**"
    paths:
      - "tools/inspect_reference_apk.py"
      - "tests/test_inspect_reference_apk.py"
      - ".github/workflows/reference-apk-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Test bounded inspection and secret redaction
        run: python3 -m unittest discover -s tests -p test_inspect_reference_apk.py
      - name: Inspect pinned public reference without installing it
        run: python3 tools/inspect_reference_apk.py --download --summary "$GITHUB_STEP_SUMMARY"
