name: GTFS Asset Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
      - "integration/**"
  workflow_dispatch:

concurrency:
  group: gtfs-assets-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gtfs-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Offline pipeline tests
        run: python3 -m unittest -v tests/test_build_gtfs_packs.py

      - name: Verify GTFS asset integrity
        run: python3 tools/build_gtfs_packs.py --check --integrity-only

      - name: Gate GTFS freshness for at least 30 days
        run: python3 tools/build_gtfs_packs.py --check --min-valid-days 30
