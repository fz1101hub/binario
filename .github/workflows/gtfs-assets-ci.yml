name: GTFS Asset Integrity

on:
  pull_request:
    paths:
      - "app/src/main/assets/**"
      - "app/src/personal/assets/**"
      - "gradle/verification-metadata.xml"
      - "requirements-ci.txt"
      - "tools/**"
      - "tests/**"
      - ".github/ci-inputs-lock.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "stabilization/**"
    paths:
      - "app/src/main/assets/**"
      - "app/src/personal/assets/**"
      - "gradle/verification-metadata.xml"
      - "requirements-ci.txt"
      - "tools/**"
      - "tests/**"
      - ".github/ci-inputs-lock.json"
      - ".github/workflows/**"
  # Weekly freshness watch (Monday): packs ending within 45 days become warnings, never failures (job freshness-watch).
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      transit_discovery:
        description: "Scoperta fonti orario (token KIND:URL separati da spazi, mdb, atlas): solo lettura, report come artifact"
        required: false
        type: string
        default: ""
      transit_packs:
        description: "Pack: 'build=all' o 'build=id1,id2' (ferrovie regionali e reti urbane), 'refresh-core=all' o 'refresh-core=id1,id2' (pack principali, ÖBB escluso), 'validate-netex'; i pack sono stampati nel log"
        required: false
        type: string
        default: ""

concurrency:
  group: gtfs-assets-ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || 'checks' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gtfs-assets:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.transit_discovery == '' && inputs.transit_packs == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Install hash-locked CI policy dependencies
        run: python3 -m pip install --require-hashes -r requirements-ci.txt

      - name: Offline pipeline tests
        run: >-
          python3 -m unittest -v
          tests/test_verify_android_app_bundles.py
          tests/test_build_gtfs_packs.py
          tests/test_netex_to_gtfs.py
          tests/test_transit_source_discovery.py
          tests/test_refresh_core_gtfs.py
          tests/test_apply_ci_gtfs_refresh.py
          tests/test_verify_gradle_dependency_metadata.py
          tests/test_install_xcodegen.py
          tests/test_verify_ci_pinning.py
          tests/test_requirements_ci.py
          tests/test_verify_embedded_assets.py
          tests/test_verify_privacy_policy.py
          tests/test_verify_android_release_config.py
          tests/test_build_store_assets.py
          tests/test_play_store_docs.py
          tests/test_app_store_docs.py

      - name: Verify immutable CI inputs
        run: |
          python3 tools/verify_ci_pinning.py
          python3 tools/verify_gradle_dependency_metadata.py

      # Regional railways and city networks (every build) and the personal-build packs get the same structural check.
      - name: Verify GTFS asset integrity
        run: |
          python3 tools/build_gtfs_packs.py --check --integrity-only
          for directory in app/src/main/assets/gtfs-transit app/src/personal/assets/gtfs-personal; do
            if [ -f "$directory/manifest.json" ]; then
              python3 tools/build_gtfs_packs.py --check --integrity-only --input-dir "$directory"
            fi
          done

      # Release freshness is a release gate, not a correctness check (audit A7-06): it blocks pull requests into a
      # stabilization branch (and release-sign in android-ci.yml, the archive in apple-watch-ci.yml). Every pack uses
      # its own minValidDays (a city feed published a few weeks at a time), capped at 30.
      - name: Gate GTFS freshness for at least 30 days
        if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'stabilization/') }}
        run: |
          python3 tools/build_gtfs_packs.py --check --min-valid-days 30
          for directory in app/src/main/assets/gtfs-transit app/src/personal/assets/gtfs-personal; do
            if [ -f "$directory/manifest.json" ]; then
              python3 tools/build_gtfs_packs.py --check --min-valid-days 30 --input-dir "$directory"
            fi
          done

      - name: Report GTFS freshness without failing
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'stabilization/')) }}
        run: >-
          python3 -I tools/refresh_core_gtfs.py --as-of "$(date --utc +%F)" --summary "$GITHUB_STEP_SUMMARY"
          --min-valid-days 30 --warn
          --freshness app/src/main/assets/gtfs app/src/main/assets/gtfs-transit app/src/personal/assets/gtfs-personal

  # Weekly reminder: every pack running less than 45 more days (its own minValidDays when shorter) is a warning in the
  # run summary, well before the 30-day gate blocks a stabilization pull request or release-sign. Never fails.
  freshness-watch:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Report the packs ending within 45 days
        run: >-
          python3 -I tools/refresh_core_gtfs.py --as-of "$(date --utc +%F)" --summary "$GITHUB_STEP_SUMMARY"
          --min-valid-days 45 --warn
          --freshness app/src/main/assets/gtfs app/src/main/assets/gtfs-transit app/src/personal/assets/gtfs-personal

  # Manual, read-only discovery of public timetable sources (GTFS, NeTEx on the Italian National Access Point).
  # The development container cannot reach most open-data hosts; the runner can. Everything downloaded is
  # untrusted data parsed by this repository's standard-library tool (python3 -I); nothing fetched is executed.
  transit-discovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.transit_discovery != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Discover sources
        env:
          DISCOVERY_TOKENS: ${{ inputs.transit_discovery }}
        run: |
          # Downloaded feeds reach this log (error messages, report lines): no line of it may run as a workflow command.
          marker="$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')"
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          mkdir -p "$RUNNER_TEMP/discovery"
          python3 -I tools/transit_source_discovery.py --out "$RUNNER_TEMP/discovery" --tokens-env DISCOVERY_TOKENS

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transit-discovery
          path: ${{ runner.temp }}/discovery/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # Manual acquisition and build of the regional-railway and city-network packs registered in
  # tools/transit_packs.json (gtfs-transit/ for every build, gtfs-personal/ for personal builds). NeTEx from the
  # National Access Point is converted by tools/netex_to_gtfs.py; 'validate-netex' first converts Trenitalia's
  # NAP dataset and compares it with the embedded trenitalia-gtfs pack. The built directories are printed in the
  # log as base64 (BINARIO_FILE/BINARIO_B64/BINARIO_END inside one BINARIO_BEGIN/BINARIO_DONE nonce frame) for review
  # and commit; nothing is pushed from here. Steps reading downloaded feeds run with workflow commands stopped.
  transit-packs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.transit_packs != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Read the selection
        id: selection
        env:
          TRANSIT_PACKS: ${{ inputs.transit_packs }}
        run: |
          python3 -I tools/acquire_transit_sources.py --selection "$TRANSIT_PACKS" | tee "$RUNNER_TEMP/selection.json"
          python3 -I - "$RUNNER_TEMP/selection.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          selection = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"validate={'true' if selection['validate'] else 'false'}")
          print(f"build={'' if selection['build'] is None else ('all' if not selection['build'] else ' '.join(selection['build']))}")
          PY

      - name: Validate the NeTEx converter on Trenitalia's NAP dataset
        if: ${{ steps.selection.outputs.validate == 'true' }}
        run: |
          # Downloaded feeds reach this log (error messages, report lines): no line of it may run as a workflow command.
          marker="$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')"
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          python3 -I tools/acquire_transit_sources.py --validate-netex 1080596 \
            --reference app/src/main/assets/gtfs/trenitalia-gtfs.zip \
            --out "$RUNNER_TEMP/netex-validation" --generated-at "$(date --utc +%F)"

      - name: Acquire, convert and build the transit packs
        if: ${{ steps.selection.outputs.build != '' }}
        env:
          BUILD_SELECTION: ${{ steps.selection.outputs.build }}
        run: |
          # Downloaded feeds reach this log (error messages, report lines): no line of it may run as a workflow command.
          marker="$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')"
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          OUT="$RUNNER_TEMP/transit"
          TODAY="$(date --utc +%F)"
          ONLY=()
          if [ "$BUILD_SELECTION" != "all" ]; then
            for id in $BUILD_SELECTION; do ONLY+=(--only "$id"); done
          fi
          python3 -I tools/acquire_transit_sources.py --out "$OUT" --generated-at "$TODAY" "${ONLY[@]}"
          for manifest in "$OUT"/manifests/*.json; do
            directory="$(basename "$manifest" .json)"
            python3 -I tools/build_gtfs_packs.py --input-dir "$OUT/input" --manifest "$manifest" \
              --output-dir "$OUT/publish/$directory" --generated-at "$TODAY"
            python3 -I tools/build_gtfs_packs.py --check --integrity-only --input-dir "$OUT/publish/$directory"
          done
          cp "$OUT/acquisition.json" "$OUT/publish/acquisition.json"
          ls -l "$OUT"/publish/*

      - name: Print the built packs
        if: ${{ steps.selection.outputs.build != '' }}
        run: python3 -I tools/acquire_transit_sources.py --print-dir "$RUNNER_TEMP/transit/publish"

      - name: Report the validity of the transit packs
        if: ${{ always() && steps.selection.outputs.build != '' }}
        run: >-
          python3 -I tools/refresh_core_gtfs.py --as-of "$(date --utc +%F)" --summary "$GITHUB_STEP_SUMMARY"
          --freshness app/src/main/assets/gtfs-transit app/src/personal/assets/gtfs-personal
          "$RUNNER_TEMP/transit/publish/gtfs-transit" "$RUNNER_TEMP/transit/publish/gtfs-personal"

  # Manual refresh of the core packs of app/src/main/assets/gtfs/ ('refresh-core=all' or 'refresh-core=id1,id2' in
  # transit_packs, together with 'build=all' for one dispatch that refreshes every pack). Each OPEN_DIRECT source is
  # downloaded from its registered HTTPS URL; Trenitalia and Italo from the latest commit of their upstream repository,
  # printed as a proposed pin for review. ÖBB is never downloaded (its portal needs the owner's acceptance). Unchanged
  # packs stay byte for byte, a failing source keeps its previous pack; the changed files are printed in the log
  # (one BINARIO_BEGIN/BINARIO_DONE nonce frame) for tools/apply_ci_gtfs_refresh.py. Nothing is pushed from here.
  core-packs:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.transit_packs, 'refresh-core=') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Download and rebuild the core packs
        env:
          TRANSIT_PACKS: ${{ inputs.transit_packs }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -I tools/refresh_core_gtfs.py --selection "$TRANSIT_PACKS" --out "$RUNNER_TEMP/core"
          --generated-at "$(date --utc +%F)" --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify the refreshed core directory
        run: python3 -I tools/build_gtfs_packs.py --check --integrity-only --input-dir "$RUNNER_TEMP/core/staging/gtfs"

      - name: Print the changed core packs
        run: python3 -I tools/acquire_transit_sources.py --print-dir "$RUNNER_TEMP/core/publish"

      - name: Report the validity of every pack
        if: always()
        run: >-
          python3 -I tools/refresh_core_gtfs.py --as-of "$(date --utc +%F)" --summary "$GITHUB_STEP_SUMMARY"
          --freshness app/src/main/assets/gtfs "$RUNNER_TEMP/core/staging/gtfs"
          app/src/main/assets/gtfs-transit app/src/personal/assets/gtfs-personal

      - name: Fail when a core source could not be refreshed
        run: python3 -I tools/refresh_core_gtfs.py --fail-on-report "$RUNNER_TEMP/core/publish/core-refresh.json"
