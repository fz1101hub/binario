name: Verify realtime APK contents
on:
  push:
    branches: ["analysis/realtime-source-20261027"]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify tested APKs contain the live source catalog
        shell: python
        env:
          BINARIO_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          import urllib.request, urllib.error, urllib.parse, os, io, zipfile, hashlib, json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              request = urllib.request.Request("https://api.github.com/repos/fz1101hub/binario/actions/artifacts/12702707629/zip",
                  headers={"Authorization":"Bearer "+os.environ["BINARIO_ARTIFACT_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              try:
                  response = urllib.request.build_opener(NoRedirect).open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code not in (301,302,303,307,308): raise
                  location = error.headers.get("Location","")
                  if urllib.parse.urlparse(location).scheme != "https": raise ValueError("Non-HTTPS artifact location")
                  response = urllib.request.urlopen(urllib.request.Request(location),timeout=30)
              with response:
                  data = response.read(64*1024*1024+1)
              if len(data)>64*1024*1024: raise ValueError("Archive exceeds size limit")
              digest=hashlib.sha256(data).hexdigest()
              if digest!="48889e955b57004adc5ddef650b7310218af0c138b39b1abea8852ae3be7cb81": raise ValueError("Artifact digest mismatch")
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  apks=[name for name in archive.namelist() if name.endswith(".apk")]
                  if len(apks)!=2: raise ValueError("Expected exactly phone and Wear OS APKs")
                  checked=[]
                  for name in apks:
                      info=archive.getinfo(name)
                      if info.file_size>64*1024*1024: raise ValueError("APK exceeds size limit")
                      payload=archive.read(name)
                      with zipfile.ZipFile(io.BytesIO(payload)) as apk:
                          entry=next((path for path in apk.namelist() if path=="rfi_stations.v1.json"),None)
                          catalog=None
                          if entry:
                              if apk.getinfo(entry).file_size>200000: raise ValueError("Station catalog exceeds size limit")
                              raw=apk.read(entry)
                              if hashlib.sha256(raw).hexdigest()!="9ec7301752382dfab3a0e6f5ce0c687065449d1e5e569e09eea2087f8b5df4ee": raise ValueError("Packaged station catalog differs from source")
                              catalog=json.loads(raw)
                              if len(catalog["stations"])!=2437: raise ValueError("Missing public station identities")
                      checked.append({"path":name,"sha256":hashlib.sha256(payload).hexdigest(),"bytes":len(payload),"rfiCatalogAtClasspathRoot":entry is not None,"rfiStations":len(catalog["stations"]) if catalog else 0})
                  phone=next((entry for entry in checked if entry["path"].endswith("/app-debug.apk") or entry["path"]=="app-debug.apk"),None)
                  if not phone or not phone["rfiCatalogAtClasspathRoot"]: raise ValueError("Phone APK cannot load the RFI station catalog")
                  print("VERIFIED_APK_JSON "+json.dumps({"head":"da67180871b4e07c28a2631a9ffc3968345d20e5","artifact":12702707629,"archiveSha256":digest,"apks":checked}))
          except Exception as error:
              print("APK_VERIFICATION_FAILURE "+type(error).__name__)
              raise SystemExit(1)
