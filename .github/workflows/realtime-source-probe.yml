name: Realtime source probe
on:
  push:
    branches: ["analysis/realtime-source-20261027"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check public HTTPS station boards without executing page scripts
        shell: python
        run: |
          import urllib.request, json, datetime, re
          base = "https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/"
          for path in ["Home", "Monitor?placeId=2416&arrivals=False", "Monitor?placeId=1728&arrivals=False"]:
              url = base + path
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Binario-source-check/1.0 (read-only)", "Accept":"text/html", "Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(1_000_001)
                      if len(body)>1_000_000: raise ValueError("Page exceeds size limit")
                      if not response.url.startswith(base): raise ValueError("Unexpected redirect")
                      print("RFI_DOCUMENT_JSON " + json.dumps({"url":response.url,"fetchedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"status":response.status,"html":body.decode("utf-8")}, ensure_ascii=True))
              except Exception as error:
                  print("RFI_SOURCE_ERROR " + json.dumps({"url":url,"type":type(error).__name__,"message":str(error)[:200]}))
