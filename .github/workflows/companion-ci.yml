name: Companion CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
      - "integration/**"
  workflow_dispatch:

concurrency:
  group: companion-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: companion-expo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: companion-expo/pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Verify managed Expo config
        run: pnpm run verify:managed-config

      - name: Regenerate Android native project from a clean state
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Require clean prebuild idempotence
        env:
          CI: "1"
        run: |
          git diff --exit-code -- android
          test -z "$(git status --porcelain -- android)"
          pnpm exec expo prebuild --platform android --clean --no-install
          git diff --exit-code -- android
          test -z "$(git status --porcelain -- android)"

      - name: Verify release security inputs
        run: pnpm run verify:release-inputs

      - name: Enable Android wrapper
        run: chmod +x android/gradlew

      - name: Android companion and Wear lint/build
        working-directory: companion-expo/android
        run: ./gradlew --no-daemon :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug
