name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "wear/**"
      - "contracts/wear-snapshot/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "PRIVACY.md"
      - "docs/store/PLAY_DATA_SAFETY.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/PIANO_STABILIZZAZIONE_v0.20.4.md"
      - "tools/verify_android_app_bundles.py"
      - "tools/verify_android_release_config.py"
      - "tools/verify_embedded_assets.py"
      - "tools/verify_gradle_dependency_metadata.py"
      - "tools/verify_privacy_policy.py"
      - "tests/test_wear_compose_gradle_dependency_suppressions.py"
      - "tools/run_android_ui_tests.sh"
      - ".github/ci-inputs-lock.json"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
      - "stabilization/**"
    paths:
      - "app/**"
      - "wear/**"
      - "contracts/wear-snapshot/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "PRIVACY.md"
      - "docs/store/PLAY_DATA_SAFETY.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/PIANO_STABILIZZAZIONE_v0.20.4.md"
      - "tools/verify_android_app_bundles.py"
      - "tools/verify_android_release_config.py"
      - "tools/verify_embedded_assets.py"
      - "tools/verify_gradle_dependency_metadata.py"
      - "tools/verify_privacy_policy.py"
      - "tests/test_wear_compose_gradle_dependency_suppressions.py"
      - "tools/run_android_ui_tests.sh"
      - ".github/ci-inputs-lock.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:
    inputs:
      verify_reproducibility:
        description: "Esegui due full rebuild e confronta gli AAB unsigned"
        required: false
        type: boolean
        default: false
      sign_release:
        description: "Firma gli AAB con l'upload key dai secret e pubblica gli artifact firmati"
        required: false
        type: boolean
        default: false
      verify_live_route:
        description: "Verifica ViaggiaTreno Appiano → Roma Ostiense con HTTPS reale su Android"
        required: false
        type: boolean
        default: false
      verify_rfi_route:
        description: "Verifica Appiano → Roma Ostiense con le fonti reali sull’emulatore"
        required: false
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: "2"

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+101"
          cache: gradle

      - name: Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Verify embedded asset integrity
        run: python3 tools/verify_embedded_assets.py --integrity-only

      - name: Gate embedded GTFS freshness for at least 30 days
        run: python3 tools/verify_embedded_assets.py --min-valid-days 30

      - name: Verify privacy-policy disclosures
        run: python3 tools/verify_privacy_policy.py

      - name: Verify release-engineering configuration
        run: |
          python3 tools/verify_android_release_config.py
          python3 tools/verify_gradle_dependency_metadata.py
          python3 -m unittest tests.test_wear_compose_gradle_dependency_suppressions

      - name: Android UI and notification tests on API 35
        timeout-minutes: 25
        env:
          BINARIO_VERIFY_LIVE_ROUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_live_route || false }}
          BINARIO_VERIFY_RFI_ROUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_rfi_route || false }}
        run: bash tools/run_android_ui_tests.sh

      - name: Unit tests, lint, debug and unsigned release builds
        run: >-
          ./gradlew --no-daemon --dependency-verification=strict
          :app:testDebugUnitTest :wear:testDebugUnitTest
          :app:lintDebug :wear:lintDebug
          :app:assembleDebug :wear:assembleDebug
          :app:assembleRelease :wear:assembleRelease
          :app:bundleRelease :wear:bundleRelease
          :app:lintVitalRelease :wear:lintVitalRelease
          :app:lintRelease :wear:lintRelease

      - name: Verify unsigned Google Play bundles
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/play-bundles-unsigned"
          python3 tools/verify_android_app_bundles.py | tee "$RUNNER_TEMP/play-bundles-unsigned/verify-android-app-bundles.log"
          cp app/build/outputs/bundle/release/app-release.aab wear/build/outputs/bundle/release/wear-release.aab "$RUNNER_TEMP/play-bundles-unsigned/"

      - name: Upload unsigned Google Play bundles
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binario-play-bundles-unsigned
          path: ${{ runner.temp }}/play-bundles-unsigned
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Prepare installable test APK
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/binario-test-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/binario-test-apk/binario-agenda-test.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/binario-test-apk/binario-agenda-test.apk" > "$RUNNER_TEMP/binario-test-apk/signature.txt"
          printf 'Source commit: %s\nAndroid 8.0 or later. Debug build for manual testing.\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/binario-test-apk/README.txt"
          cd "$RUNNER_TEMP/binario-test-apk"
          sha256sum binario-agenda-test.apk > SHA256SUMS

      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binario-agenda-test-apk
          path: ${{ runner.temp }}/binario-test-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Upload Android UI reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/binario-ui-*.log
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: First reproducibility rebuild
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_reproducibility) || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'stabilization/')) }}
        run: >-
          ./gradlew --no-daemon --rerun-tasks --dependency-verification=strict
          :app:bundleRelease :wear:bundleRelease

      - name: Capture reproducibility references
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_reproducibility) || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'stabilization/')) }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/binario-app-reference.aab"
          cp wear/build/outputs/bundle/release/wear-release.aab "$RUNNER_TEMP/binario-wear-reference.aab"

      - name: Second reproducibility rebuild
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_reproducibility) || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'stabilization/')) }}
        run: >-
          ./gradlew --no-daemon --rerun-tasks --dependency-verification=strict
          :app:bundleRelease :wear:bundleRelease

      - name: Verify reproducible Google Play bundles
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_reproducibility) || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'stabilization/')) }}
        run: >-
          python3 tools/verify_android_app_bundles.py
          --reference-phone "$RUNNER_TEMP/binario-app-reference.aab"
          --reference-wear "$RUNNER_TEMP/binario-wear-reference.aab"

  release-sign:
    needs: android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: "2"

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+101"
          cache: gradle

      - name: Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Decode the upload keystore into RUNNER_TEMP
        env:
          BINARIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.BINARIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$BINARIO_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$BINARIO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/binario-upload.jks"
          test -s "$RUNNER_TEMP/binario-upload.jks"

      - name: Signed Google Play bundles
        env:
          BINARIO_RELEASE_STORE_FILE: ${{ runner.temp }}/binario-upload.jks
          BINARIO_RELEASE_STORE_PASSWORD: ${{ secrets.BINARIO_RELEASE_STORE_PASSWORD }}
          BINARIO_RELEASE_KEY_ALIAS: ${{ secrets.BINARIO_RELEASE_KEY_ALIAS }}
          BINARIO_RELEASE_KEY_PASSWORD: ${{ secrets.BINARIO_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$BINARIO_RELEASE_STORE_PASSWORD"
          test -n "$BINARIO_RELEASE_KEY_ALIAS"
          test -n "$BINARIO_RELEASE_KEY_PASSWORD"
          ./gradlew --no-daemon --dependency-verification=strict :app:bundleRelease :wear:bundleRelease

      - name: Verify signed Google Play bundles
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/play-bundles-signed"
          python3 tools/verify_android_app_bundles.py --signed | tee "$RUNNER_TEMP/play-bundles-signed/verify-android-app-bundles.log"
          cp app/build/outputs/bundle/release/app-release.aab wear/build/outputs/bundle/release/wear-release.aab "$RUNNER_TEMP/play-bundles-signed/"

      - name: Upload signed Google Play bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binario-play-bundles-signed
          path: ${{ runner.temp }}/play-bundles-signed
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Remove the upload keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/binario-upload.jks"
