name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - "stabilization/**"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: "2"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Verify embedded asset integrity
        run: python3 tools/verify_embedded_assets.py --integrity-only

      # Release candidates must additionally run without --integrity-only.
      # That command intentionally remains red until every embedded timetable
      # covers the full release freshness window.

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
