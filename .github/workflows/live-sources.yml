name: Live source acceptance

on:
  pull_request:
    paths:
      - "app/src/main/java/it/binario/app/data/live/**"
      - "app/src/main/java/it/binario/app/data/gtfs/**"
      - "app/src/test/java/it/binario/app/data/live/LiveProviderNetworkTest.kt"
      - ".github/workflows/live-sources.yml"
  workflow_dispatch:
    inputs:
      sources:
        description: "Fonti: rfi,sta,sncf,italo,european-sleeper,viaggiatreno,viaggiatreno-html"
        required: true
        type: string
        default: "rfi,sta,sncf,italo,european-sleeper,viaggiatreno"

permissions:
  contents: read

concurrency:
  group: live-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+101"
          cache: gradle
      - name: Verify selected sources
        env:
          LIVE_SOURCES: ${{ inputs.sources || 'rfi,sta,sncf,italo,european-sleeper,viaggiatreno' }}
        run: |
          python3 - <<'PY'
          import os
          sources = os.environ['LIVE_SOURCES'].split(',')
          assert sources and all(s in {'rfi', 'sta', 'sncf', 'italo', 'european-sleeper', 'viaggiatreno', 'viaggiatreno-html'} for s in sources)
          PY
      - name: Functional source checks
        env:
          LIVE_SOURCES: ${{ inputs.sources || 'rfi,sta,sncf,italo,european-sleeper,viaggiatreno' }}
        run: >-
          ./gradlew --no-daemon --max-workers=2 --dependency-verification=strict
          -Pkotlin.compiler.execution.strategy=in-process
          "-PBINARIO_LIVE_SOURCE_ACCEPTANCE=$LIVE_SOURCES"
          :app:testDebugUnitTest --tests it.binario.app.data.live.LiveProviderNetworkTest
      - name: Report provider failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/test-results/testDebugUnitTest').glob('*LiveProviderNetworkTest*.xml'):
              root = ET.parse(path).getroot()
              for output in root.iter('system-out'):
                  for line in (output.text or '').splitlines():
                      if line.startswith('LIVE_ACCEPTANCE '):
                          print(line)
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = failure.get('message', '').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title=Live {case.get('name')}::{message[:1800]}")
          PY
      - name: Source acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-source-acceptance
          path: |
            app/build/test-results/testDebugUnitTest/*LiveProviderNetworkTest*.xml
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
