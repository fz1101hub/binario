name: Live source acceptance

on:
  pull_request:
    paths:
      - "app/src/main/java/it/binario/app/data/live/**"
      - "app/src/main/java/it/binario/app/data/gtfs/**"
      - "app/src/test/java/it/binario/app/data/live/LiveProviderNetworkTest.kt"
      - ".github/workflows/live-sources.yml"
  workflow_dispatch:
    inputs:
      sources:
        description: "Fonti: rfi,sta,sncf,italo,european-sleeper,viaggiatreno,viaggiatreno-html,opendata-ch,notices,open-meteo,urban,gbfs,discovery"
        required: true
        type: string
        default: "rfi,sta,sncf,italo,european-sleeper,viaggiatreno"

permissions:
  contents: read

concurrency:
  group: live-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+101"
          cache: gradle
      - name: Verify selected sources
        env:
          LIVE_SOURCES: ${{ inputs.sources || 'rfi,sta,sncf,italo,european-sleeper,viaggiatreno' }}
        run: |
          python3 - <<'PY'
          import os
          sources = os.environ['LIVE_SOURCES'].split(',')
          assert sources and all(s in {'rfi', 'sta', 'sncf', 'italo', 'european-sleeper', 'viaggiatreno', 'viaggiatreno-html', 'opendata-ch', 'notices', 'open-meteo', 'urban', 'gbfs', 'discovery'} for s in sources)
          PY
      - name: Functional source checks
        env:
          LIVE_SOURCES: ${{ inputs.sources || 'rfi,sta,sncf,italo,european-sleeper,viaggiatreno' }}
        run: >-
          ./gradlew --no-daemon --max-workers=2 --dependency-verification=strict
          -Pkotlin.compiler.execution.strategy=in-process
          "-PBINARIO_LIVE_SOURCE_ACCEPTANCE=$LIVE_SOURCES"
          :app:testDebugUnitTest --tests it.binario.app.data.live.LiveProviderNetworkTest
      # A check whose source publishes nothing at this moment (night, no trains) is skipped, and a skipped test is
      # green: each skip is a warning and the summary says how many checks really ran (second audit, ci-tests-build-8).
      - name: Report provider failures and skipped checks
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def escape(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def title(text):
              return escape(text).replace(':', '%3A').replace(',', '%2C')

          total = skipped = failed = 0
          for path in sorted(Path('app/build/test-results/testDebugUnitTest').glob('*LiveProviderNetworkTest*.xml')):
              root = ET.parse(path).getroot()
              for output in root.iter('system-out'):
                  for line in (output.text or '').splitlines():
                      if line.startswith('LIVE_ACCEPTANCE '):
                          print(line)
              for case in root.iter('testcase'):
                  total += 1
                  name = case.get('name', '')
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  skip = case.find('skipped')
                  if failure is not None:
                      failed += 1
                      print(f"::error title=Live {title(name)}::{escape(failure.get('message', ''))[:1800]}")
                  elif skip is not None:
                      skipped += 1
                      reason = skip.get('message') or 'presupposto non soddisfatto: la fonte non pubblica dati in questo momento?'
                      print(f"::warning title=Live {title(name)} non verificato::{escape(reason)[:1800]}")
          line = f"Verificati {total - skipped - failed} di {total} controlli delle fonti ({skipped} saltati, {failed} falliti)"
          print(f"::{'warning' if skipped or not total else 'notice'} title=Live source acceptance::{line}")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as stream:
                  stream.write(f"### Live source acceptance\n\n{line}\n")
          PY
      - name: Source acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-source-acceptance
          path: |
            app/build/test-results/testDebugUnitTest/*LiveProviderNetworkTest*.xml
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
