name: Alexa Companion CI

on:
  pull_request:
    paths:
      - "alexa-companion/**"
      - ".github/workflows/alexa-companion-ci.yml"
  push:
    branches:
      - main
      - "integration/**"
    paths:
      - "alexa-companion/**"
      - ".github/workflows/alexa-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: alexa-companion-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alexa-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: alexa-companion

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
          run_install: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: alexa-companion/pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high and critical vulnerabilities
        run: pnpm audit --audit-level high

      - name: TypeScript
        run: pnpm run check

      - name: Verify Drizzle schema has no drift
        env:
          DATABASE_URL: mysql://unused:unused@127.0.0.1:3306/unused
        run: |
          pnpm run db:generate
          test -z "$(git status --porcelain --untracked-files=all -- drizzle)"

      - name: Unit tests
        run: pnpm test

      - name: Real MariaDB migration checks
        env:
          RUN_DB_MIGRATION_TESTS: "1"
          DATABASE_URL: mysql://root@127.0.0.1:3306/mysql
        run: pnpm run test:db-migrations

      - name: Production build and bundle verification
        run: pnpm run build
