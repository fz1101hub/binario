name: Alexa Companion CI

on:
  pull_request:
    paths:
      - "alexa-companion/**"
      - ".github/workflows/alexa-companion-ci.yml"
  push:
    branches:
      - main
      - "stabilization/**"
      - "integration/**"
    paths:
      - "alexa-companion/**"
      - ".github/workflows/alexa-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: alexa-companion-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alexa-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: alexa-companion

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: alexa-companion/pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high and critical vulnerabilities
        run: pnpm audit --audit-level high

      - name: TypeScript
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Real MariaDB migration checks
        env:
          RUN_DB_MIGRATION_TESTS: "1"
          DATABASE_URL: mysql://root@127.0.0.1:3306/mysql
        run: pnpm run test:db-migrations

      - name: Production build and bundle verification
        run: pnpm run build
