name: BinarioWatch
options:
  bundleIdPrefix: it.binario
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  BinarioWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [BinarioWatch, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.watch
        INFOPLIST_KEY_CFBundleDisplayName: Binario
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKWatchOnly: YES
    entitlements:
      path: BinarioWatch/BinarioWatch.entitlements
  BinarioWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BinarioWatchTests
      - path: Shared
      - path: ../contracts/wear-snapshot/v1/ios-to-apple-watch-v1.json
        buildPhase: resources
    dependencies:
      - target: BinarioWatch
  BinarioWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [BinarioWatchWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.watch.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Binario
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: BinarioWatch/BinarioWatch.entitlements
