name: BinarioWatch
options:
  bundleIdPrefix: it.binario
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  BinarioWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [BinarioWatch, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.watch
        INFOPLIST_KEY_CFBundleDisplayName: Binario
    entitlements:
      path: BinarioWatch/BinarioWatch.entitlements
  BinarioWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [BinarioWatchTests, Shared]
    dependencies:
      - target: BinarioWatch
  BinarioWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [BinarioWatchWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.watch.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Binario
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: BinarioWatch/BinarioWatch.entitlements
