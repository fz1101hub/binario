name: Binario
options:
  bundleIdPrefix: it.binario
  createIntermediateGroups: true
  # Italian is the development region and the fallback for unsupported device languages,
  # as on Android; the seventeen .lproj folders in Resources declare the localisations and
  # XcodeGen derives knownRegions from them (docs/l10n/LOCALES.md).
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Archiving for App Store needs one team on every target (and the App Groups capability on
    # the two Watch App IDs, which automatic signing registers). XcodeGen substitutes the
    # variable at generation time: export BINARIO_APPLE_TEAM_ID before `xcodegen generate`;
    # unset, the project stays unsigned as CI (CODE_SIGNING_ALLOWED=NO) requires.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${BINARIO_APPLE_TEAM_ID}"
packages:
  BinarioKit:
    path: BinarioKit
targets:
  Binario:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BinarioApp
      - path: Resources
        buildPhase: resources
      - path: ../app/src/main/assets/stations/curated_it_rail_stations.json
        buildPhase: resources
    scheme:
      testTargets:
        - BinarioAppTests
        - BinarioKitTests
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.ios
        PRODUCT_NAME: Binario
        GENERATE_INFOPLIST_FILE: YES
        # The keys INFOPLIST_KEY_ cannot express, merged with the generated ones: only App Transport
        # Security's exception for Android's single cleartext hop, an HTTPS request to
        # www.viaggiatreno.it redirected to the same resource over HTTP on that host (subdomains
        # excluded), as in Android's network_security_config.xml. Every other request is HTTPS.
        INFOPLIST_FILE: Configuration/Binario-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Binario
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # A launch screen entry keeps the app out of letterboxed compatibility mode, and
        # App Store Connect rejects builds without a 1024 pt opaque app icon.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Binario 2.0 green (Resources/Assets.xcassets, light and dark): the app-wide tint.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Only the operating system's HTTPS (URLSession, live rail data) and a pure-Swift SHA-256 for
        # integrity: export-compliance exempt. Without the key App Store Connect holds every build
        # as "Missing Compliance".
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # «Stazione più vicina» (EXPO_PORT_PLAN I7): When-In-Use only, asked on a tap, one position used
        # on the iPhone and kept nowhere. The text is the Italian one (the development language); each
        # of the 17 languages has it in Resources/<language>.lproj/InfoPlist.strings. No microphone,
        # speech or Always key.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Binario usa la tua posizione una sola volta, quando chiedi la stazione più vicina, per trovarla nell’elenco delle stazioni salvato sul telefono. La posizione non viene salvata né inviata."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # Watch Connectivity is unsupported on Apple silicon Macs and Apple Vision, and the
        # app was never exercised there: do not offer the iPhone build on those stores.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        debug:
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
    dependencies:
      - package: BinarioKit
      - target: BinarioWatch
        embed: true
  BinarioAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BinarioAppTests
    dependencies:
      - target: Binario
      - package: BinarioKit
    settings:
      base:
        PRODUCT_NAME: BinarioAppTests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Binario.app/Binario"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
  BinarioKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BinarioKit/Tests/BinarioKitTests
      - path: ../contracts/wear-snapshot/v1/ios-to-apple-watch-v1.json
        buildPhase: resources
    dependencies:
      - package: BinarioKit
    settings:
      base:
        PRODUCT_NAME: BinarioKitTests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
  BinarioWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../apple-watch/BinarioWatch
      - path: ../apple-watch/Shared
      # Watch UI strings: without the catalogue the Watch shows raw keys.
      - path: ../apple-watch/Resources
        buildPhase: resources
    scheme:
      testTargets:
        - BinarioWatchTests
    settings:
      base:
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        PRODUCT_NAME: BinarioWatch
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.ios.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Binario
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_WKWatchOnly: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: it.binario.ios
        # The Watch app ships only inside Binario.app/Watch: installing it on its own as well puts a
        # second top-level app in the archive, which Xcode then treats as a generic archive that
        # cannot be distributed to App Store Connect.
        SKIP_INSTALL: YES
        # App Store Connect rejects an embedded Watch app without its own 1024 pt icon (ITMS-90713).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Binario 2.0 green from the Watch catalogue: the app-wide tint, navigation title included.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        debug:
          # BinarioWatchTests uses `@testable import BinarioWatch`: the Debug build must be
          # compiled with testability, as the iPhone app above and the standalone harness are.
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
    entitlements:
      path: ../apple-watch/BinarioWatch/BinarioWatch.entitlements
    dependencies:
      - target: BinarioWatchWidgets
        embed: true
  BinarioWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../apple-watch/BinarioWatchTests
      - path: ../contracts/wear-snapshot/v1/ios-to-apple-watch-v1.json
        buildPhase: resources
    dependencies:
      - target: BinarioWatch
    settings:
      base:
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        PRODUCT_NAME: BinarioWatchTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BinarioWatch.app/BinarioWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
  BinarioWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../apple-watch/BinarioWatchWidgets
      - path: ../apple-watch/Shared
      # Watch UI strings: without the catalogue the Watch shows raw keys.
      - path: ../apple-watch/Resources
        buildPhase: resources
    settings:
      base:
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        PRODUCT_NAME: BinarioWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: it.binario.ios.watchkitapp.widgets
        # Embedded in BinarioWatch.app/PlugIns only, never installed on its own.
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Binario
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../apple-watch/BinarioWatchWidgets/Info.plist
      configs:
        debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
    entitlements:
      path: ../apple-watch/BinarioWatch/BinarioWatch.entitlements
